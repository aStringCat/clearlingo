<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>清译 ClearLingo</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <img src="../icons/icon-48.png" alt="">
        <div>
          <h1>清译</h1>
          <p>ClearLingo</p>
        </div>
        <span class="status" id="status">就绪</span>
      </header>

      <button class="primary" id="toggle" type="button">
        <span id="toggle-label">翻译当前网页</span>
        <span aria-hidden="true">→</span>
      </button>

      <section aria-labelledby="language-label">
        <label id="language-label" for="target-language">翻译为</label>
        <select id="target-language">
          <option value="zh-CN">简体中文</option>
          <option value="zh-TW">繁體中文</option>
          <option value="en">English</option>
          <option value="ja">日本語</option>
          <option value="ko">한국어</option>
          <option value="fr">Français</option>
          <option value="de">Deutsch</option>
          <option value="es">Español</option>
          <option value="it">Italiano</option>
          <option value="pt">Português</option>
          <option value="ru">Русский</option>
          <option value="ar">العربية</option>
        </select>
      </section>

      <section aria-labelledby="display-label">
        <span id="display-label">显示方式</span>
        <div class="segmented" role="radiogroup" aria-labelledby="display-label">
          <button type="button" role="radio" data-mode="bilingual" aria-checked="true">双语对照</button>
          <button type="button" role="radio" data-mode="translation" aria-checked="false">仅译文</button>
        </div>
      </section>

      <footer>快捷键 <kbd>⌥ T</kbd></footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
